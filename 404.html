<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>404 Not Found</title><link rel="apple-touch-icon" sizes="180x180" href="./1718875527281.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet"><style>body {font-family: 'Inconsolata', monospace;}h2 {font-family: 'Inconsolata', monospace;font-size: 1.5rem;}</style></head><body><h2>404 Not Found</h2><p>I couldn’t find the file you asked for, so I returned a 404 instead.</p><p>Let's go back to the previous page.</p><br><br><br><p>Click on the space</p><p>Click to ←↑↓→</p><canvas id=c width=200 height=200></canvas><script>let x=c.getContext("2d"),s=10,p=[{x:10,y:10}],dx=0,dy=0,f={x:15,y:15},run=0;onkeydown=e=>{if(e.code=="Space"){if(!run)run=1;return} if(!run)return;if(e.key[5]=="U")dy=-1,dx=0;if(e.key[5]=="D")dy=1,dx=0;if(e.key[5]=="L")dx=-1,dy=0;if(e.key[5]=="R")dx=1,dy=0};setInterval(()=>{if(!run)return;let h={x:p[0].x+dx,y:p[0].y+dy};if(h.x==f.x&&h.y==f.y)f={x:~~(Math.random()*20),y:~~(Math.random()*20)};else p.pop();if(h.x<0||h.y<0||h.x>=20||h.y>=20||p.some(e=>e.x==h.x&&e.y==h.y)) return alert("Game Over"),p=[{x:10,y:10}],dx=dy=0,run=0;p.unshift(h);x.fillRect(0,0,200,200);x.clearRect(f.x*s,f.y*s,s,s);p.forEach(e=>x.clearRect(e.x*s,e.y*s,s,s))},150)</script></body></html>
